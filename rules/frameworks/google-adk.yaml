# rules/frameworks/google-adk.yaml — Google Agent Development Kit (ADK) usage.
pack: google-adk
version: 1
rules:
  - id: google-adk/import
    kind: framework
    provider: google-adk
    languages: [python]
    keywords: ["google.adk"]
    pattern: '\b(?:import|from)\s+google\.adk\b'
    regions: [code]
    claim: { name: "google-adk" }
    confidence: 0.75

  # LlmAgent / SequentialAgent / ... are ADK's distinctive agent classes; the
  # bare Agent alias is too generic to key on.
  - id: google-adk/construct
    kind: framework
    provider: google-adk
    languages: [python]
    keywords: ["LlmAgent", "SequentialAgent", "ParallelAgent", "LoopAgent"]
    pattern: '\b(?:LlmAgent|SequentialAgent|ParallelAgent|LoopAgent)\s*\('
    regions: [code]
    claim: { name: "google-adk" }
    confidence: 0.7
