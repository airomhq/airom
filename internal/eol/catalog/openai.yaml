# catalog/openai.yaml — OpenAI model lifecycle facts.
#
# Every record is transcribed from OpenAI's own deprecations page (the `source`
# URL below), never inferred from a naming pattern. `verified` is the date a
# maintainer last checked the page. A model absent from this file gets NO
# lifecycle claim — that is "unknown", not "supported".
#
# `state` records what the provider announced; whether a shutdown has ARRIVED is
# derived at scan time from the date, so these records stay truthful as time
# passes without being re-edited.
# SCOPE: these dates apply to the OpenAI-operated API. Azure OpenAI publishes
# its OWN retirement schedule for the same models, so Azure deployments (which
# AIROM detects with provider "azure-openai") deliberately do NOT match this
# file — claiming these dates for Azure would be unverified.
provider: openai
version: 1
source: https://developers.openai.com/api/docs/deprecations
verified: 2026-07-23
