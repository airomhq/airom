# catalog/anthropic.yaml — Claude model lifecycle facts (Anthropic-operated API).
#
# Every record is transcribed from Anthropic's own model-deprecations page (the
# `source` URL below), never inferred. `verified` is the date a maintainer last
# checked it. A model absent from this file gets NO lifecycle claim.
#
# SCOPE: these dates apply to Anthropic-operated platforms (the Claude API,
# Claude Platform on AWS, and Microsoft Foundry). Partner
# platforms (Amazon Bedrock, Google Vertex) publish their OWN retirement
# schedules for the same weights, so a Bedrock model id is deliberately NOT
# matched by this file — it would be a claim we have not verified.
#
# NOTE ON ACTIVE MODELS: Anthropic publishes a "not sooner than <date>" floor
# for active models. That is a commitment not to retire BEFORE that date — it is
# not a shutdown date, so it is deliberately not recorded as one. Recording it
# would wrongly flag a fully supported model as deprecated.
provider: anthropic
version: 1
source: https://platform.claude.com/docs/en/docs/about-claude/model-deprecations
verified: 2026-07-23
models:
