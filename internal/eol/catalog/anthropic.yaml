    aliases: [claude-1.1, claude-1.2, claude-1.3, claude-instant-1.0, claude-instant-1.1, claude-instant-1.2]
    state: deprecated
    announced: 2024-09-04
    shutdown: 2024-11-06
    replacement: claude-haiku-4-5-20251001

