replicaCount: 3

image:
  repository: ghcr.io/airomhq/airom
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  httpPort: 8080
  gatewayPort: 8081

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: airom.enterprise.internal
      paths:
        - path: /
          pathType: Prefix
          port: 8080
        - path: /v1
          pathType: Prefix
          port: 8081
  tls:
    - secretName: airom-tls-cert
      hosts:
        - airom.enterprise.internal

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - airom-enterprise
          topologyKey: "kubernetes.io/hostname"

env:
  AIROM_PORT: "8080"
  AIROM_GATEWAY_PORT: "8081"
  AIROM_LOG_LEVEL: "info"
  AIROM_MAX_TEMPERATURE: "0.7"
  AIROM_MAX_TOKENS: "4096"
  AIROM_ENABLE_REDACTION: "true"
  AIROM_CIRCUIT_BREAKER_LIMIT: "30"

secrets:
  jwtSecret: "CHANGE_ME_IN_PRODUCTION_JWT_SECRET_KEY_998877"
  stripeWebhookSecret: ""
