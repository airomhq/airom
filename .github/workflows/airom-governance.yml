name: AIROM Governance & Compliance

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  airom-scan:
    name: AIROM Governance Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AIROM Scanner
        uses: ./
        with:
          target: '.'
          compliance: 'colorado-ai-act'
          fail-on: 'local-model-file&confidence>=0.9'
          sarif-output: 'airom.sarif'
          upload-sarif: 'false'

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'airom.sarif'
          category: 'airom-governance'
