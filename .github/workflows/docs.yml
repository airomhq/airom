# Validates the documentation site and proves it still builds.
#
# Hosting is Vercel's job, not this workflow's: the docs-site project deploys
# docs.airom.dev from `docs-site/` on every push to main and gives every pull
# request a preview URL. This workflow exists so a broken docs change fails on
# the PR that made it — with the strict validator and the link checker, which
# Vercel does not run — rather than deploying green and reading wrong.
#
# The build step deliberately shells out to the SAME docs-site/build.sh that
# Vercel runs. Two copies of the build would drift, and the copy CI checks would
# stop being the copy that ships.
name: Docs

on:
  push:
    branches: [main]
    paths: ["docs-site/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs-site/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Mintlify refuses to run on Node 25+. docs-site/package.json pins
      # engines.node to 24.x for Vercel; this pins the same major here so the
      # two builds cannot diverge on the one thing that hard-fails.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Strict: fails on warnings as well as errors.
      - name: Validate
        working-directory: docs-site
        run: npx --yes mint@latest validate

      - name: Check links
        working-directory: docs-site
        run: npx --yes mint@latest broken-links

      - name: Build the static site
        working-directory: docs-site
        run: bash build.sh

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: docs-site/dist
          retention-days: 14
