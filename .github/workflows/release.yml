name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release and upload assets
  id-token: write # keyless cosign signing via OIDC

env:
  GO_VERSION: "1.25"

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history + tags for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify before releasing
        run: |
          go vet ./...
          go test ./...

      # cosign for keyless artifact signing; syft for the SBOM (goreleaser
      # invokes both).
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      - name: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The self-scan outputs are no longer attached to the release, but the
      # scan still runs: it is the only place the freshly built release binary
      # is executed against a real tree. If the shipped artifact cannot scan,
      # this fails the release rather than a user discovering it. Written to a
      # temp dir so nothing lands in the release assets.
      - name: Smoke-test the release binary against this repo
        run: |
          bin=$(find dist -type f -name airom -path '*linux_amd64*' | head -1)
          out=$(mktemp -d)
          "$bin" fs . -o cyclonedx="$out/self.cdx.json" -o json="$out/self.aibom.json"
          python3 - "$out/self.aibom.json" <<'PY'
          import json, sys
          inv = json.load(open(sys.argv[1]))
          n = len(inv.get("components", []))
          if n < 2:
              sys.exit(f"the release binary scanned its own repo and found {n} components")
          print(f"ok: release binary found {n} components in its own tree")
          PY
