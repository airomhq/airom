name: 'AIROM Compliance & AIBOM Scanner'
description: 'Discover AI components, verify .airomapproved governance, detect parameter drift, and generate compliance reports.'
author: 'AIROM HQ'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  target:
    description: 'Path or directory to scan'
    required: false
    default: '.'
  fail-on:
    description: 'Policy gate expression to fail CI (e.g., "local-model-file&confidence>=0.9" or "cve:critical")'
    required: false
    default: ''
  compliance:
    description: 'Compliance framework to evaluate (colorado-ai-act, nyc-ll144, ca-ab2013, nist-ai-rmf, owasp-llm-top-10)'
    required: false
    default: ''
  sarif-output:
    description: 'Path to write SARIF report'
    required: false
    default: 'airom-results.sarif'
  json-output:
    description: 'Path to write CycloneDX AIBOM JSON'
    required: false
    default: 'aibom.cdx.json'
  api-key:
    description: 'AIROM Cloud API Key for ComplianceDB ledger upload'
    required: false
    default: ''
  upload-sarif:
    description: 'Automatically upload SARIF to GitHub Code Scanning (requires security-events: write)'
    required: false
    default: 'true'

outputs:
  sarif-path:
    description: 'Path to the generated SARIF file'
    value: ${{ inputs.sarif-output }}
  aibom-path:
    description: 'Path to the generated CycloneDX AIBOM file'
    value: ${{ inputs.json-output }}
  exit-code:
    description: 'Scan execution exit code'
    value: ${{ steps.run-airom.outputs.exit-code }}

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: false

    - name: Build AIROM CLI
      shell: bash
      run: |
        go build -o airom-bin ./cmd/airom

    - name: Run AIROM Scan
      id: run-airom
      shell: bash
      run: |
        FLAGS=""
        if [ -n "${{ inputs.compliance }}" ]; then
          FLAGS="$FLAGS --compliance ${{ inputs.compliance }}"
        fi
        if [ -n "${{ inputs.fail-on }}" ]; then
          FLAGS="$FLAGS --fail-on \"${{ inputs.fail-on }}\""
        fi

        ./airom-bin scan "${{ inputs.target }}" \
          -o "sarif=${{ inputs.sarif-output }}" \
          -o "cyclonedx=${{ inputs.json-output }}" \
          -o table \
          $FLAGS || EXIT_CODE=$?

        echo "exit-code=${EXIT_CODE:-0}" >> $GITHUB_OUTPUT
        exit ${EXIT_CODE:-0}

    - name: Upload SARIF to GitHub Code Scanning
      if: ${{ inputs.upload-sarif == 'true' && (success() || failure()) }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-output }}
        category: 'airom-governance'
