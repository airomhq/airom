name: 'AIROM Security & Compliance Scanner'
description: 'Automated AI Governance, AIBOM generation, Regulatory Compliance (EU AI Act, Colorado, NYC, California), and Security Scanning in CI/CD'
author: 'AIROM Technologies'
branding:
  icon: 'shield-check'
  color: 'purple'

inputs:
  path:
    description: 'Path or repository directory to scan'
    required: false
    default: '.'
  output-format:
    description: 'Output format (table, json, yaml, sarif, cdx, spdx, vex)'
    required: false
    default: 'sarif'
  output-file:
    description: 'File path to save the scan report'
    required: false
    default: 'airom-report.sarif'
  fail-on-risk:
    description: 'Fail the action if risks at or above this level are found (none, low, medium, high, critical)'
    required: false
    default: 'high'
  policy:
    description: 'Policy level to enforce (recommended, strict, permissive)'
    required: false
    default: 'recommended'
  post-pr-comment:
    description: 'Whether to post a formatted summary comment on Pull Requests'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for posting PR comments and check runs'
    required: false
    default: ${{ github.token }}
  server-url:
    description: 'AIROM Enterprise Server URL for ComplianceDB sync (optional)'
    required: false
    default: ''
  api-key:
    description: 'AIROM Enterprise API Key for authenticated sync (optional)'
    required: false
    default: ''

outputs:
  findings-count:
    description: 'Total number of detected findings'
  high-risks-count:
    description: 'Total number of high or critical risk findings'
  compliance-status:
    description: 'Overall compliance status (pass, gap, manual_review)'
  report-file:
    description: 'Path to the generated report file'

runs:
  using: 'composite'
  steps:
    - name: Run AIROM Governance Scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FORMAT: ${{ inputs.output-format }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_FAIL_ON_RISK: ${{ inputs.fail-on-risk }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_POST_PR_COMMENT: ${{ inputs.post-pr-comment }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_SERVER_URL: ${{ inputs.server-url }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        bash ${{ github.action_path }}/entrypoint.sh
